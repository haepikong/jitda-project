<body>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const TEACHER_PASSWORD = 'info2026';
    const moods = ['차분했어요','궁금했어요','뿌듯했어요','조금 어려웠어요'];
    let role = 'student';
    let identity = null;
    let demoReflections = [];
    let selectedMood = moods[0];
    let filter = 'all';
    let reflections = [];
    let classrooms = [];
    let courseCatalog = [];
    let teacherView = 'students';
    let summaryMode = 'all';
    let lessonReflections = [];
    let lessonEvents = null;
    let speechRecognition = null;
    let startingRecognition = false;
    let recognitionError = '';
    let recognitionHeardSpeech = false;
    let teacherName = localStorage.getItem('baeumgil-teacher-name') || '';
    let lessonClassCode = '';
    let studentSearch = { course: 'all', from: '', to: '', text: '' };
    let classroomLookupTimer = null;
    let classroomLookupSequence = 0;
    let events = null;
    let pollTimer = null;
    let toastTimer;

    const icon = (name) => {
      const paths = {
        book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20M8 7h8"/>',
        leaf: '<path d="M20 4c-8 0-14 3-14 10a6 6 0 0 0 6 6c7 0 10-7 8-16Z"/><path d="M4 21c3-5 7-8 12-11"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
        logout: '<path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>',
        heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>',
        spark: '<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 15 1 2.5 2.5 1-2.5 1L19 22l-1-2.5-2.5-1 2.5-1L19 15Z"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>'
      };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.leaf}</svg>`;
    };
    const escapeHTML = (value='') => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const dayLabel = (value) => new Date(value).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
    const dateTime = (value) => new Date(value).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const toDateInput = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    function shiftMonths(date,months){const shifted=new Date(date);const day=shifted.getDate();shifted.setDate(1);shifted.setMonth(shifted.getMonth()-months);shifted.setDate(Math.min(day,new Date(shifted.getFullYear(),shifted.getMonth()+1,0).getDate()));return shifted}
    function enteredClassroom(){const code=document.getElementById('class-code')?.value.trim().toLocaleLowerCase();if(code==='try-class')return{id:'demo-class',name:'체험 학급',code:'TRY-CLASS',courses:['과학','국어','수학'],isDemo:true};return classrooms.find(item=>item.code.trim().toLocaleLowerCase()===code)}
    function setStudentCourseOptions(classroom){const select=document.getElementById('course');if(!select)return;const previous=select.value;select.innerHTML=(classroom.courses||[]).map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')||'<option value="">이 학급에 과목이 아직 없어요. 선생님께 문의해 주세요.</option>';if((classroom.courses||[]).includes(previous))select.value=previous}
    function updateStudentCourses(){const select=document.getElementById('course');const input=document.getElementById('class-code');if(!select||!input)return;const hint=document.getElementById('class-code-hint');const code=input.value.trim();const requestId=++classroomLookupSequence;clearTimeout(classroomLookupTimer);if(!code){select.innerHTML='<option value="">학급 코드를 먼저 입력해 주세요</option>';hint.className='class-code-hint';hint.textContent='선생님이 알려주신 학급 코드를 입력해 주세요.';return}if(code.toLocaleLowerCase()==='try-class'){const demo=enteredClassroom();setStudentCourseOptions(demo);hint.className='class-code-hint valid';hint.textContent='체험 학급 코드예요. 샘플 성찰 기록으로 화면을 둘러볼 수 있어요.';return}const local=enteredClassroom();if(local){setStudentCourseOptions(local);hint.className='class-code-hint valid';hint.textContent=`${local.name} 학급을 찾았어요. 과목을 선택해 주세요.`;return}select.innerHTML='<option value="">학급 확인 중...</option>';hint.className='class-code-hint loading';hint.textContent='학급 코드를 확인하고 있어요…';classroomLookupTimer=setTimeout(async()=>{try{const response=await fetch(`/api/classrooms/lookup?code=${encodeURIComponent(code)}`);if(requestId!==classroomLookupSequence)return;if(!response.ok)throw new Error('Class not found');const classroom=await response.json();const known=classrooms.find(item=>item.id===classroom.id);if(known)Object.assign(known,classroom);else classrooms.push(classroom);setStudentCourseOptions(classroom);hint.className='class-code-hint valid';hint.textContent=`${classroom.name} 학급을 찾았어요. 과목을 선택해 주세요.`}catch{if(requestId!==classroomLookupSequence)return;select.innerHTML='<option value="">등록된 과목이 없어요</option>';hint.className='class-code-hint invalid';hint.textContent='학급 코드를 찾을 수 없어요. 공백과 기호를 확인하거나 선생님께 코드를 다시 물어보세요.'}},120)}
    async function refreshClassrooms(){try{const [classResponse,courseResponse]=await Promise.all([fetch('/api/classrooms'),fetch('/api/courses')]);if(classResponse.ok&&courseResponse.ok){classrooms=await classResponse.json();courseCatalog=await courseResponse.json();updateStudentCourses();updateLiveData()}}catch{}}

    function renderLogin(){
      stopLiveUpdates();
      document.getElementById('app').innerHTML = `
        <header class="shell topbar"><a class="brand" href="#"><span class="brand-mark">${icon('book')}</span>배움길</a><span class="top-caption">교사와 학생이 함께 쓰는 배움 기록</span><a class="download-project" href="/download-project.zip" download="baeumgil-project.zip">${icon('download')}<span>앱 코드 다운로드</span></a></header>
        <main class="shell login-layout">

      updateStudentCourses();

    function appHeader(title, subtitle, mascot='student-bean-mascot.png'){
      const initial = title.slice(0,1);
      return `<header class="app-header"><div class="shell app-header-inner"><a class="brand" href="#"><span class="brand-mark">${icon('book')}</span>배움길</a><div class="header-actions"><a class="download-project" href="/download-project.zip" download="baeumgil-project.zip">${icon('download')}<span>앱 코드 다운로드</span></a><div class="user-area"><span class="avatar">${escapeHTML(initial)}</span><div><div class="user-label">${escapeHTML(title)}</div><div class="user-sub">${escapeHTML(subtitle)}</div></div><button class="text-button" id="logout" type="button">나가기 ${icon('logout')}</button></div></div></div></header>`;
    }
    function seedDemoReflections(){const now=Date.now();const sample=(name,number,course,learned,difficulty,nextStep,days,sticker,reply='')=>({id:`demo-${name}-${course}-${days}`,classCode:'TRY-CLASS',course,number,name,mood:'궁금했어요',learned,difficulty,nextStep,reply,stickerAt:sticker?now-days*86400000:0,createdAt:now-days*86400000});demoReflections=[sample(identity.name,identity.number,'과학','식물이 빛을 향해 자라는 까닭을 배웠어요. 모둠 실험에서 빛의 방향을 바꿔 관찰하니 신기했어요.','빛이 약하면 식물은 어떻게 자랄지 궁금해요.','다음에는 햇빛 양도 바꾸어 비교하고 싶어요.',2,true,'빛의 방향을 바꿔 관찰한 점이 좋았어요. 다음에는 햇빛 양도 바꿔보면 어떨까요?'),sample(identity.name,identity.number,'국어','친구의 발표를 들으며 글의 중심 생각을 찾는 방법을 알게 되었어요.','중심 문장과 뒷받침 문장을 구분하는 게 조금 어려웠어요.','다음 시간에는 문단마다 중심 문장을 찾아볼래요.',1,true),sample(identity.name,identity.number,'수학','분수 나눗셈은 나누는 수를 뒤집어 곱하면 된다는 것을 알았어요.','','문제를 더 풀고 친구에게 설명해 보고 싶어요.',0,false),sample('민준','7','과학','모둠에서 식물 관찰 결과를 발표했어요.','실험 결과 설명이 어려웠어요.','다음에는 표로 정리해 볼래요.',1,true),sample('민준','7','국어','인물의 마음을 근거를 들어 설명했어요.','','다른 인물도 비교해 보고 싶어요.',3,true),sample('민준','7','수학','분수 계산 방법을 익혔어요.','','문제를 더 풀어볼래요.',4,true),sample('서연','15','과학','빛과 식물의 관계를 배웠어요.','햇빛에 따라 결과가 어떻게 달라지는지 궁금해요.','다른 조건으로도 실험해 볼래요.',1,true)]}
    function ownReflections(){const source=identity.isDemo?demoReflections:reflections;return source.filter(item=>item.classCode===identity.classCode&&item.number===identity.number&&item.name===identity.name)}
    function studentStickers(){return ownReflections().filter(item=>item.stickerAt).length}
    function rewardName(count){if(count>=10)return '성장왕 콩 배지';if(count>=5)return '배움 응원 쿠폰';if(count>=3)return '칭찬콩 배지';return '첫 보상까지 조금만 더!'}
    function stickerRankings(classCode='all'){const source=identity?.isDemo?demoReflections:reflections;const totals=new Map();for(const item of source.filter(item=>item.stickerAt&&(classCode==='all'||item.classCode===classCode))){const key=`${item.classCode}|${item.number}|${item.name}`;const student=totals.get(key)||{name:item.name,number:item.number,classCode:item.classCode,count:0};student.count+=1;totals.set(key,student)}let previousCount=null;let rank=0;return [...totals.values()].sort((a,b)=>b.count-a.count||a.number.localeCompare(b.number,undefined,{numeric:true})||a.name.localeCompare(b.name,'ko')).map((item,index)=>{if(item.count!==previousCount)rank=index+1;previousCount=item.count;return{...item,rank}})}
    function stickerIcons(count){const visible=Math.min(count,10);return `<span class="sticker-icons" role="img" aria-label="칭찬 스티커 ${count}개">${Array.from({length:visible},()=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f1c45d" stroke="#9a6a18" stroke-width="1.2" d="m12 1.8 2.1 2.3 3.1-.2 1.2 2.8 2.8 1.2-.2 3.1 2.3 2.1-1.5 2.7.8 3-2.7 1.5-.6 3.1-3.1.5-1.9 2.5-2.9-1-2.9 1-1.9-2.5-3.1-.5-.6-3.1-2.7-1.5.8-3-1.5-2.7 2.3-2.1-.2-3.1 2.8-1.2 1.2-2.8 3.1.2z"/><path fill="#fff9df" d="m12 6.2 1.7 3.5 3.9.6-2.8 2.7.7 3.9-3.5-1.8-3.5 1.8.7-3.9-2.8-2.7 3.9-.6z"/></svg>').join('')}${count>visible?`<span class="sticker-icons-more">+${count-visible}</span>`:''}</span>`}
    function stickerOverview(classCode='all'){const entries=reflections.filter(item=>item.stickerAt&&(classCode==='all'||item.classCode===classCode));return{issued:entries.length,students:new Set(entries.map(item=>`${item.classCode}|${item.number}|${item.name}`)).size,classes:new Set(entries.map(item=>item.classCode)).size}}
    function renderStickerDashboard(){const overview=stickerOverview();return `<div class="sticker-dashboard"><div class="sticker-summary-grid"><article class="sticker-summary-card"><span id="sticker-issued-label">전체 발급 스티커</span><strong id="sticker-total-issued">${overview.issued}장</strong><div id="sticker-total-icons">${stickerIcons(overview.issued)}</div></article><article class="sticker-summary-card"><span id="sticker-students-label">스티커 받은 학생</span><strong id="sticker-total-students">${overview.students}명</strong></article><article class="sticker-summary-card"><span id="sticker-total-classes-label">참여 학급</span><strong id="sticker-total-classes">${overview.classes}개</strong></article></div><section class="panel sticker-status-panel"><div class="sticker-status-head"><div><h2>칭찬 스티커 현황판</h2><p>전체 학급 또는 한 반의 스티커 수와 학생 순위를 실시간으로 확인해요.</p></div><select id="sticker-class-filter" aria-label="현황을 볼 학급 선택"><option value="all">전체 학급</option>${classrooms.map(item=>`<option value="${escapeHTML(item.code)}">${escapeHTML(item.name)}</option>`).join('')}</select></div><div class="sticker-status-list" id="sticker-status-list">${renderStickerRowsMarkup('all')}</div><div class="sticker-status-updated" id="sticker-status-updated">방금 업데이트했어요.</div></section></div>`}
    function renderStickerRowsMarkup(classCode='all'){const rankings=stickerRankings(classCode);const max=Math.max(1,...rankings.map(item=>item.count));return rankings.length?rankings.map(item=>`<article class="sticker-status-row"><span class="sticker-status-rank">${item.rank}위</span><strong class="sticker-status-student">${escapeHTML(item.name)}<small>${escapeHTML(item.classCode)} · ${escapeHTML(item.number)}번</small></strong><div class="sticker-status-meter" aria-label="순위 내 스티커 비율"><span style="width:${Math.max(8,item.count/max*100)}%"></span></div><span class="sticker-count-visual">${stickerIcons(item.count)}<span class="sticker-count-label">${item.count}장</span></span></article>`).join(''):'<div class="sticker-status-empty">아직 발급된 칭찬 스티커가 없어요.<br>학생 성찰 기록에서 첫 스티커를 선물해 보세요.</div>'}
    function renderStickerRows(){const classCode=document.getElementById('sticker-class-filter')?.value||'all';const list=document.getElementById('sticker-status-list');if(list)list.innerHTML=renderStickerRowsMarkup(classCode);const overview=stickerOverview(classCode);const issued=document.getElementById('sticker-total-issued');const icons=document.getElementById('sticker-total-icons');const students=document.getElementById('sticker-total-students');const classes=document.getElementById('sticker-total-classes');if(issued)issued.textContent=`${overview.issued}장`;if(icons)icons.innerHTML=stickerIcons(overview.issued);if(students)students.textContent=`${overview.students}명`;if(classes)classes.textContent=`${overview.classes}개`;const scope=classCode==='all'?'전체 학급':classrooms.find(item=>item.code===classCode)?.name||classCode;const issuedLabel=document.getElementById('sticker-issued-label');const studentsLabel=document.getElementById('sticker-students-label');const classesLabel=document.getElementById('sticker-total-classes-label');if(issuedLabel)issuedLabel.textContent=`${scope} 발급 스티커`;if(studentsLabel)studentsLabel.textContent=`${scope} 스티커 받은 학생`;if(classesLabel)classesLabel.textContent=classCode==='all'?'참여 학급':'확인 중인 학급';const updated=document.getElementById('sticker-status-updated');if(updated)updated.textContent=`실시간 현황 · ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`}
    function studentClassRank(){const student=stickerRankings(identity.classCode).find(item=>item.number===identity.number&&item.name===identity.name);return student?{rank:student.rank,count:student.count,total:stickerRankings(identity.classCode).length}:null}
    function renderStudentRankings(){const rankings=stickerRankings(identity.classCode);const own=studentClassRank();return `<div class="ranking-card"><div class="ranking-title">우리 반 칭찬 순위 <small>${escapeHTML(identity.className)}</small></div><div class="leaderboard">${rankings.slice(0,3).map(item=>`<div class="leader-row ${item.number===identity.number&&item.name===identity.name?'me':''}"><span><b class="rank-number">${item.rank}</b>${escapeHTML(item.name)}</span><strong class="leader-sticker-total">${stickerIcons(item.count)}<small>${item.count}장</small></strong></div>`).join('')||'<span style="font-size:13px;color:#405448">첫 칭찬 스티커를 기다리고 있어요.</span>'}</div><div class="rank-self-card">내 칭찬 스티커 ${studentStickers()}장 ${own?`· 반 순위 ${own.rank}위 / ${own.total}명`:'· 스티커를 받으면 순위에 올라가요'}</div></div>`}
    function renderStudentRewards(){const count=studentStickers();const next=count<3?3:count<5?5:count<10?10:10;const progress=count>=10?100:Math.min(100,count/next*100);const courseCounts=classrooms.find(item=>item.id===identity.classroomId)?.courses||[...new Set(ownReflections().map(item=>item.course))];return `<section class="student-rewards"><div class="reward-card"><div class="sticker-award-visual">${stickerIcons(count)}<span class="sticker-award-count">${count}장</span><span class="sticker-award-caption">내가 받은 스티커</span></div><div class="reward-copy"><strong>${escapeHTML(rewardName(count))}</strong><small>${count>=10?'최고 보상에 도달했어요!':`${next-count}개 더 모으면 다음 보상을 받아요.`}</small><div class="reward-progress"><span style="width:${progress}%"></span></div></div></div><div class="subject-summary"><div class="reward-heading">과목별 기록 <span style="color:#596a5f;font-weight:400">· 전체 ${ownReflections().length}개</span></div><div class="subject-chips">${courseCounts.map(course=>`<span class="subject-chip">${escapeHTML(course)} <strong>${ownReflections().filter(item=>item.course===course).length}</strong></span>`).join('')||'<span class="subject-chip">아직 과목별 기록이 없어요</span>'}</div></div>${renderStudentRankings()}</section>`}
    function renderStudent(){
      const mine=ownReflections();
      document.getElementById('app').innerHTML=`${appHeader(`${identity.name} 학생`,`${identity.classCode} · ${identity.number}번 · ${identity.course}`)}<main class="shell app-main"><div class="welcome-row"><div class="welcome-copy"><img src="/ai-images/student-bean-mascot.png" alt="콩이 학생 마스코트"><div><span class="eyebrow">MY LEARNING JOURNAL</span><h1 class="page-title">오늘의 배움, 한 줄부터</h1><p class="page-subtitle">잘한 점도 막힌 순간도 모두 다음 배움의 재료예요.</p></div></div><span class="date-chip">${dayLabel(Date.now())}</span></div>${renderStudentRewards()}<div class="student-grid"><section class="panel"><div class="panel-head"><div><h2 class="panel-heading">오늘의 성찰일기</h2><div class="panel-kicker">${escapeHTML(identity.course)} · 기억나는 만큼 편하게 적어보세요</div></div><span class="soft-chip">${icon('leaf')}</span></div><form class="journal-form" id="journal-form"><div class="field"><label>오늘의 마음</label><div class="mood-row">${moods.map(mood=>`<button class="mood-button ${mood===selectedMood?'active':''}" type="button" data-mood="${escapeHTML(mood)}">${escapeHTML(mood)}</button>`).join('')}</div></div><div class="field"><label for="learned">오늘 새롭게 알게 된 것</label><textarea id="learned" name="learned" rows="3" placeholder="오늘 배운 내용 중 기억에 남는 것을 적어봐요." required></textarea></div><div class="prompt-row"><button class="prompt-button" type="button" data-fill="learned" data-text="가장 기억에 남는 순간은 ">가장 기억에 남는 순간은…</button><button class="prompt-button" type="button" data-fill="difficulty" data-text="조금 더 알고 싶은 점은 ">조금 더 알고 싶은 점은…</button></div><div class="field"><label for="difficulty">어려웠거나 더 궁금한 점</label><textarea id="difficulty" name="difficulty" rows="2" placeholder="막힌 부분이나 선생님께 묻고 싶은 것을 적어도 좋아요."></textarea></div><div class="field"><label for="nextStep">다음 시간에 해보고 싶은 것</label><textarea id="nextStep" name="nextStep" rows="2" placeholder="다음에는 무엇을 시도해 볼까요?"></textarea></div><div class="form-note">${icon('heart')}<span>일기를 보내면 선생님이 읽고 답장을 남길 수 있어요. 답장은 오른쪽 내 기록에 나타납니다.</span></div><div class="journal-actions"><small>작성한 기록은 같은 학급·수업에서 확인할 수 있어요.</small><button class="submit-button" type="submit">일기 보내기 ${icon('send')}</button></div></form></section><section class="panel history-panel"><div class="panel-head"><div><h2 class="panel-heading">나의 배움 기록</h2><div class="panel-kicker">과목과 날짜를 골라 지난 기록을 찾아봐요</div></div><span class="status-chip done" id="history-count">${mine.length}개 기록</span></div><div class="history-tools"><select id="history-course" aria-label="과목으로 기록 찾기"><option value="all">모든 과목</option>${[...new Set([...classrooms.find(item=>item.id===identity.classroomId)?.courses||[],...mine.map(item=>item.course)])].map(course=>`<option value="${escapeHTML(course)}" ${studentSearch.course===course?'selected':''}>${escapeHTML(course)}</option>`).join('')}</select><input id="history-from" type="date" aria-label="시작 날짜" value="${escapeHTML(studentSearch.from)}"><input id="history-to" type="date" aria-label="끝 날짜" value="${escapeHTML(studentSearch.to)}"><input id="history-text" type="search" placeholder="기록 내용 검색" aria-label="기록 내용 검색" value="${escapeHTML(studentSearch.text)}"></div><div class="history-search-status" id="history-status"></div><div class="history-list" id="my-history">${renderStudentHistory(filterStudentHistory(mine))}</div></section></div></main>`;

    function summarizeKeywords(items,field){const keywords=['실험','관찰','발표','토론','모둠','친구','질문','설명','이해','문제 해결','계산','읽기','쓰기','그림','자료','협력','새롭게','어려웠','재미있','궁금','빛','식물','분수','나눗셈','분수','역사','환경','코딩','인공지능','느낌'];const text=items.map(item=>item[field]||'').join(' ').toLocaleLowerCase();return keywords.map(word=>({word,count:(text.match(new RegExp(word,'g'))||[]).length})).filter(item=>item.count>0).sort((a,b)=>b.count-a.count).slice(0,8)}
    function renderSummaryBody(items){const total=items.length;const students=new Set(items.map(item=>`${item.classCode}|${item.number}|${item.name}`)).size;const questions=items.filter(item=>item.difficulty?.trim());const replied=items.filter(item=>item.reply?.trim()).length;const learnings=summarizeKeywords(items,'learned');const difficulties=summarizeKeywords(items,'difficulty');const nextSteps=summarizeKeywords(items,'nextStep');const quotes=[...items].sort((a,b)=>b.createdAt-a.createdAt).filter(item=>item.learned?.trim()).slice(0,4);const classCode=document.getElementById('summary-class')?.value||'all';const course=document.getElementById('summary-course')?.value||'all';const period=document.getElementById('summary-period')?.value||'30';const label=`${classCode==='all'?'전체 학급':classrooms.find(item=>item.code===classCode)?.name||classCode} · ${course==='all'?'전체 과목':course} · ${period==='all'?'전체 기간':`최근 ${period}일`}`;if(!total)return `<div class="summary-empty">${escapeHTML(label)}에 해당하는 성찰일기가 아직 없어요.<br>학생들이 기록을 남기면 수업 참고 요약이 여기에 나타납니다.</div>`;return `<div class="class-summary"><div class="summary-period">요약 범위: ${escapeHTML(label)}</div><div class="summary-note">학생 글에서 반복된 단어를 모아 만든 참고용 요약입니다. 자동 집계이므로 수업에 활용하기 전에 아래 학생 기록 원문도 함께 살펴봐 주세요.</div><div class="summary-stat-row"><article class="summary-stat"><span>성찰 기록</span><strong>${total}개</strong></article><article class="summary-stat"><span>참여 학생</span><strong>${students}명</strong></article><article class="summary-stat"><span>궁금증 기록 · 답변</span><strong>${questions.length}개 · ${replied}개</strong></article></div><div class="summary-grid"><section class="summary-card"><h3>학생들이 많이 적은 배움</h3><div class="summary-tags">${learnings.map(item=>`<span class="summary-tag">${escapeHTML(item.word)}<small>${item.count}회</small></span>`).join('')||'<p>반복해서 나온 배움 주제가 아직 적어요.</p>'}</div></section><section class="summary-card"><h3>더 살펴볼 궁금증</h3><div class="summary-tags">${difficulties.map(item=>`<span class="summary-tag" style="     function renderClassSummary(){return `<section class="class-summary"><div class="summary-mode"><span class="summary-mode-label">요약 범위</span><button class="summary-mode-button ${summaryMode==='all'?'active':''}" data-summary-mode="all" type="button">전체 학급 비교</button><button class="summary-mode-button ${summaryMode==='individual'?'active':''}" data-summary-mode="individual" type="button">개별 학급 분석</button></div><div class="panel summary-controls"><div class="field ${summaryMode==='all'?'hidden':''}" id="summary-class-field"><label for="summary-class">학급</label><select id="summary-class"><option value="all">학급 선택</option>${classrooms.map((item,index)=>`<option value="${escapeHTML(item.code)}" ${summaryMode==='individual'&&(item.code===(classrooms[0]?.code||''))?'selected':''}>${escapeHTML(item.name)}</option>`).join('')}</select></div><div class="field"><label for="summary-course">과목</label><select id="summary-course"><option value="all">모든 과목</option>${[...new Set(classrooms.flatMap(item=>item.courses))].map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')}</select></div><div class="field"><label for="summary-period">기간</label><select id="summary-period"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="all">전체 기간</option></select></div></div><section id="class-summary-results">${renderClassSummaryOverview()}</section></section>`}
    function renderClassSummaryOverview(){if(summaryMode==='individual')return `<section class="panel">${renderSummaryBody(summaryItems())}</section>`;const items=summaryItems();if(!items.length)return `<section class="panel">${renderSummaryBody(items)}</section>`;const groups=classrooms.map(classroom=>({classroom,items:items.filter(item=>item.classCode===classroom.code)}));const oldClass=document.getElementById('summary-class')?.value;const comparisons=groups.map(({classroom,items:classItems})=>{const learned=summarizeKeywords(classItems,'learned')[0]?.word||'아직 배움 기록이 없어요';const question=summarizeKeywords(classItems,'difficulty')[0]?.word||'궁금증이 아직 없어요';const next=summarizeKeywords(classItems,'nextStep')[0]?.word||'다음 목표가 아직 없어요';const students=new Set(classItems.map(item=>`${item.number}|${item.name}`)).size;return `<article class="class-compare-item"><strong>${escapeHTML(classroom.name)} · ${classItems.length}개 기록</strong><span>참여 ${students}명<br>많이 나온 배움: ${escapeHTML(learned)}<br>궁금증 단서: ${escapeHTML(question)}<br>다음 목표 단서: ${escapeHTML(next)}</span></article>`}).join('');const detail=groups.map(({classroom,items:classItems})=>{const select=document.getElementById('summary-class');if(select)select.value=classroom.code;return `<section class="class-summary-group"><header class="class-summary-group-head"><h3>${escapeHTML(classroom.name)}</h3><span>${classItems.length}개 성찰 기록</span></header>${renderSummaryBody(classItems)}</section>`}).join('');if(oldClass&&document.getElementById('summary-class'))document.getElementById('summary-class').value=oldClass;const students=new Set(items.map(item=>`${item.classCode}|${item.number}|${item.name}`)).size;return `<div class="class-summary"><div class="summary-note">전체 학급을 비교해 수업에서 공통으로 나온 주제와 반별 차이를 살펴보세요. 각 요약 항목과 원문은 반 이름과 함께 표시됩니다.</div><div class="summary-stat-row"><article class="summary-stat"><span>전체 성찰 기록</span><strong>${items.length}개</strong></article><article class="summary-stat"><span>참여 학생</span><strong>${stude     function renderLessonManagement(){const selected=classrooms.find(item=>item.code===lessonClassCode)||classrooms[0];lessonClassCode=selected?.code||'';return `<div class="lesson-layout"><section class="panel"><div class="panel-head"><div><h2 class="panel-heading">내 수업 돌아보기</h2><div class="panel-kicker">수업을 받아쓰고, 분석을 살펴본 뒤 내 성찰로 저장해요</div></div><span class="status-chip">개인 성찰</span></div><form class="lesson-form" id="lesson-reflection-form"><div class="field lesson-teacher-field"><label for="lesson-teacher-name">선생님 이름</label><input id="lesson-teacher-name" value="${escapeHTML(teacherName)}" placeholder="내 이름을 입력해 주세요" required></div><div class="field-grid"><div class="field"><label for="lesson-class">학급</label><select id="lesson-class" name="classCode" required>${classrooms.map(item=>`<option value="${escapeHTML(item.code)}" ${item.code===lessonClassCode?'selected':''}>${escapeHTML(item.name)}</option>`).join('')}</select></div><div class="field"><label for="lesson-course">과목</label><select id="lesson-course" name="course" required>${(selected?.courses||[]).map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')}</select></div></div><div class="field"><label for="lesson-title">수업 제목</label><input id="lesson-title" name="title" placeholder="예: 빛과 식물의 성장 탐구" required></div><div class="field"><div class="lesson-recording-head"><label for="lesson-transcript">수업 녹음 받아쓰기</label><button class="record-button" id="lesson-record-button" type="button">녹음 시작</button></div><p class="recording-note" id="recording-status">녹음 중지 시 받아쓴 내용을 문장으로 정리하고 수업 분석과 성찰일기 초안을 자동으로 만들어요. 브라우저가 음성 인식을 지원하지 않으면 내용을 직접 입력한 뒤 분석을 눌러주세요.</p><textarea id="lesson-transcript" name="transcript" rows="7" placeholder="녹음 받아쓰기를 하거나 수업 중 기억나는 내용을 직접 적어주세요." required></textarea></div><div class="lesson-controls"><button class="analyze-button" id="analyze-lesson" type="button">수업 내용 분석하기</button><button class="save-lesson-button" id="save-lesson" type="submit">내 수업 성찰 저     function updateLessonCourses(){const classCode=document.getElementById('lesson-class')?.value;const classroom=classrooms.find(item=>item.code===classCode);lessonClassCode=classCode||'';const select=document.getElementById('lesson-course');if(select)select.innerHTML=(classroom?.courses||[]).map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')||'<option value="">먼저 과목을 등록해 주세요</option>'}
    function renderLessonEntries(items){if(!teacherName)return '<div class="lesson-history-empty">먼저 선생님 이름을 입력해 주세요.<br>저장한 내 수업 기록이 여기에 모입니다.</div>';if(!items.length)return '<div class="lesson-history-empty">아직 저장한 수업 성찰이 없어요.<br>첫 수업을 녹음 받아쓰거나 내용을 입력해 보세요.</div>';return [...items].sort((a,b)=>b.createdAt-a.createdAt).map(item=>`<article class="lesson-entry"><h3>${escapeHTML(item.title)}</h3><div class="lesson-entry-meta">${escapeHTML(item.className)} · ${escapeHTML(item.course)} · ${dateTime(item.createdAt)}</div><section><strong>나의 수업 성찰일기</strong><p>${escapeHTML(item.reflection||'')}</p></section><section><strong>수업 받아쓰기</strong><p>${escapeHTML(item.transcript)}</p></section><section><strong>잘한 점</strong><p>${escapeHTML(item.strengths)}</p></section><section><strong>다음에 살펴볼 점</strong><p>${escapeHTML(item.growth)}</p></section><section><strong>다음 수업에서 시도할 것</strong><p>${escapeHTML(item.nextStep)}</p></section></article>`).join('')}
    function tidyLessonTranscript(value){let text=value.replace(/\s+/g,' ').trim();if(!text)return '';text=text.replace(/\s*([,，、])\s*/g,'$1 ').replace(/\s*([.!?。！？])\s*/g,'$1\n').replace(/\n{2,}/g,'\n').trim();if(text&&!/[.!?。！？]$/.test(text))text+='.';return text}
    function toggleLessonRecording(){const button=document.getElementById('lesson-record-button');const status=document.getElementById('recording-status');const transcript=document.getElementById('lesson-transcript');if(speechRecognition){button.textContent='음성 인식 마치는 중';button.disabled=true;status.className='recording-note listening';status.textContent='마지막으로 인식한 문장을 정리하고 있어요. 잠시 기다려 주세요.';speechRecognition.stop();return}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){status.className='recording-note error';status.textContent='이 브라우저는 음성 인식을 지원하지 않아 자동 받아쓰기를 시작할 수 없어요. 최신 Chrome 또는 Edge에서 다시 시도하거나, 아래 입력칸에 수업 내용을 직접 적어주세요.';return}const recognizer=new SpeechRecognition();speechRecognition=recognizer;recognitionError='';recognitionHeardSpeech=false;recognizer.lang='ko-KR';recognizer.continuous=true;recognizer.interimResults=true;const base=transcript.value.trim();button.textContent='받아쓰기 중지';button.disabled=false;button.classList.add('recording');status.className='recording-note listening';status.textContent='마이크 연결을 기다리고 있어요. 권한 창이 뜨면 마이크 사용을 허용해 주세요.';recognizer.onstart=()=>{status.className='recording-note listening';status.textContent='마이크가 켜졌어요. 수업 내용을 소리 내어 말하면 글이 여기에 나타납니다.'};recognizer.onresult=event=>{let recognized='';for(let index=0;index<event.results.length;index++){const phrase=event.results[index][0]?.transcript?.trim()||'';if(phrase)recognized+=`${phrase} `}recognized=recognized.trim();if(recognized){recognitionHeardSpeech=true;transcript.value=[base,recognized].filter(Boolean).join(base?' ':'');status.className='recording-note listening';status.textContent=`받아쓰는 중 · ${recognized.slice(-90)}`}else{status.className='recording-note listening';status.textContent='마이크가 켜져 있어요. 수업 내용을 말하면 받아쓴 글이 여기에 나타납니다.'}};recognizer.onerror=event=>{recognitionError=event.error||'unknown';const messages={'not-allowed':'마이크 권한이 거부됐어요. 주소창의 마이크 권한을 허용한 뒤 다시 시작해 주세요.','service-not-allowed':'브라우저 음성 인식 서비스에 연결할 수 없어요.     async function toggleLessonRecording(){const button=document.getElementById('lesson-record-button');const status=document.getElementById('recording-status');const transcript=document.getElementById('lesson-transcript');if(speechRecognition){button.textContent='받아쓰기 마치는 중';button.disabled=true;status.className='recording-note listening';status.textContent='마지막 음성 문장을 받아쓰고 있어요. 잠시 기다려 주세요.';speechRecognition.stop();return}if(startingRecognition)return;const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){status.className='recording-note error';status.textContent='이 브라우저는 음성을 글로 바꾸는 기능을 지원하지 않아요. Chrome 또는 Edge에서 다시 시도하거나 수업 내용을 직접 입력해 주세요.';return}if(!navigator.mediaDevices?.getUserMedia){status.className='recording-note error';status.textContent='이 페이지에서 마이크를 사용할 수 없어요. HTTPS 주소로 열거나 수업 내용을 직접 입력해 주세요.';return}startingRecognition=true;button.disabled=true;button.textContent='마이크 연결 중';status.className='recording-note listening';status.textContent='마이크 사용 권한을 확인하고 있어요. 브라우저에서 권한을 물으면 허용해 주세요.';let permissionStream;try{permissionStream=await navigator.mediaDevices.getUserMedia({audio:true});permissionStream.getTracks().forEach(track=>track.stop())}catch(error){startingRecognition=false;button.disabled=false;button.textContent='녹음 시작';status.className='recording-note error';const messages={NotAllowedError:'마이크 권한이 거부됐어요. 주소창의 사이트 설정에서 마이크를 허용한 뒤 다시 시작해 주세요.',NotFoundError:'사용할 수 있는 마이크가 없어요. 마이크를 연결하거나 수업 내용을 직접 입력해 주세요.',NotReadableError:'마이크를 다른 앱에서 사용 중일 수 있어요. 다른 앱을 닫고 다시 시도해 주세요.',SecurityError:'안전하지 않은 연결에서는 마이크를 쓸 수 없어요. HTTPS 주소로 접속해 주세요.'};status.textContent=messages[error.name]||`마이크를 열지 못했어요 (${error.name}). 권한과 마이크 연결을 확인해 주세요.`;return}startingRecognition=false;const recognizer=new SpeechRecognition();speechRecognition=recognizer;recognitionError='';recognitionHeardSpeech=false;recognizer.lang='ko-KR';recognizer.continuous=true;recognizer.interimResults=true;const base=transcript.value.trim();button.disab .textContent='말소리가 감지되지 않아 글로 바뀐 내용이 없어요. 마이크 가까이에서 말한 뒤 다시 중지하거나 직접 입력해 주세요.';return}status.textContent='받아쓴 문장이 짧아요. 내용을 더 말하거나 직접 보완한 뒤 수업 내용 분석하기를 눌러주세요.'};try{recognizer.start()}catch(error){speechRecognition=null;button.disabled=false;button.textContent='녹음 시작';button.classList.remove('recording');status.className='recording-note error';status.textContent=`음성 받아쓰기를 시작하지 못했어요 (${error.name}). 페이지를 새로 열고 다시 시도해 주세요.`}}
    function analyzeLesson(options={}){const transcriptField=document.getElementById('lesson-transcript');const transcript=tidyLessonTranscript(transcriptField.value);transcriptField.value=transcript;if(transcript.length<20){if(!options.automatic)showToast('수업 내용을 두세 문장 이상 적어주세요.');return false}const strengths=[];const growth=[];const next=[];if(/왜|어떻게|무엇|생각해|질문|궁금/.test(transcript))strengths.push('질문을 던져 학생이 생각을 펼칠 수 있는 장면이 기록되어 있어요.');if(/짝|모둠|토론|함께|협력|발표/.test(transcript))strengths.push('학생이 서로 의견을 나누거나 참여하는 활동이 드러나요.');if(/예를 들어|실험|자료|시범|직접 해|활동/.test(transcript))strengths.push('개념을 예시나 활동과 연결해 설명한 점을 돌아볼 수 있어요.');if(/확인|정리|요약|배운 점|이해했|피드백|잘했/.test(transcript))strengths.push('이해를 확인하거나 피드백을 건네는 장면을 담으셨어요.');if(!strengths.length)strengths.push('수업 내용을 기록해 되돌아볼 근거를 만드셨어요. 중요한 장면과 학생 반응을 더 적으면 강점을 구체적으로 살펴볼 수 있어요.');if(!/확인|정리|요약|배운 점|이해했|질문 있/.test(transcript)){growth.push('수업 마무리에 학생이 무엇을 이해했는지 짧게 확인하는 과정이 기록에서 잘 보이지 않아요.');next.push('마지막 2분 동안 학생이 오늘 배운 점을 한 문장으로 말하거나 적도록 해보세요.')}if(!/학생|짝|모둠|토론|발표|대답/.test(transcript)){growth.push('학생이 어떻게 반응하고 참여했는지 기록이 적어요. 설명 뒤에 학생 목소리를 들을 시간을 돌아보면 좋아요.');next.push('핵심 설명 뒤 5초 기다리고, 짝과 먼저 이야기한 후 몇 명의 생각을 들어보세요.')}if(transcript.length<140){growth.push('기록이 짧아 수업 흐름과 학생 반응을 충분히 판단하기 어려워요.');next.push('다음 기록에는 기억에 남는 학생 반응이나 예상과 달랐던 순간을 한 가지 추가해 보세요.')}if(!growth.length)growth.push('기록된 내용만으로 뚜렷한 어려움을 정하기는 어려워요. 학생 반응이나 예상과 달랐던 순간을 덧붙여 살펴보세요.');if(!next.length)next.push('오늘 효과가 있었던 질문이나 활동을 다음 시간에도 이어가고, 학생 반응이 달라지는지 관찰해 보세요.');const strengthText=strengths.map(item=>`• ${item}`).join('\n');const growthText=growth.map(item=>`• ${item}`).join('\n');const nextText=next.map(item=>`• ${item}`).join('\n');document.getElementById('lesson-strengths').value=strengthText;document.getElementById('lesson-growth').value=growthText;document.getElementById('lesson-next-step').value=nextText;const reflectionField=document.getElementById('lesson-reflection');reflectionField.value=`오늘 수업에서는 ${transcript.slice(0,180)}${transcript.length>180?'…':''}\n\n잘된 점은 ${strengths[0]}\n\n다음에는 ${growth[0]} 이를 바탕으로 ${next[0]}`;document.getElementById('lesson-analysis').classList.add('visible');document.getElementById('lesson-analysis').dataset.ready='true';if(options.automatic){const status=document.getElementById('recording-status');status.textContent='받아쓰기를 정리하고 수업 분석과 성찰일기 초안을 만들었어요. 저장 전에 내용을 확인하고 고쳐주세요.'}else showToast('수업 분석과 성찰일기 초안을 만들었어요. 내용을 살펴보고 고쳐주세요.');return true}
    async function saveLessonReflection(event){event.preventDefault();if(!teacherName.trim()){showToast('먼저 선생님 이름을 입력해 주세요.');return}if(document.getElementById('lesson-analysis').dataset.ready!=='true'){showToast('먼저 수업 내용을 녹음하거나 입력해 분석해 주세요.');return}if(!document.getElementById('lesson-reflection').value.trim()){showToast('수업 성찰일기를 작성해 주세요.');return}const form=event.currentTarget;const data=new FormData(form);const classroom=classrooms.find(item=>item.code===data.get('classCode'));const button=document.getElementById('save-lesson');button.disabled=true;try{const response=await fetch('/api/lesson-reflections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacherName,classCode:data.get('classCode'),className:classroom?.name,course:data.get('course'),title:data.get('title'),transcript:data.get('transcript'),strengths:data.get('strengths'),growth:data.get('growth'),nextStep:data.get('nextStep'),reflection:data.get('reflection')})});if(!response.ok)throw new Error('수업 성찰을 저장하지 못했어요. 학급과 과목을 확인해 주세요.');form.reset();document.getElementById('lesson-teacher-name').value=teacherName;document.getElementById('lesson-class').value=lessonClassCode||classrooms[0]?.code;updateLessonCourses();document.getElementById('lesson-analysis').classList.remove('visible');document.getElementById('lesson-analysis').dataset.ready='false';await refreshLessonReflections();showToast('내 수업 성찰 기록을 저장했어요.')}catch(error){showToast(error.message)}finally{button.disabled=false}}
    async function refreshLessonReflections(){if(!teacherName)return;try{const response=await fetch(`/api/lesson-reflections?teacher=${encodeURIComponent(teacherName)}`);if(response.ok){lessonReflections=await response.json();updateLessonList()}}catch{}}
    function updateLessonList(){const list=document.getElementById('lesson-history-list');if(list)list.innerHTML=renderLessonEntries(lessonReflections);const count=document.getElementById('lesson-record-count');if(count)count.textContent=`${lessonReflections.length}개`;const stats=document.querySelectorAll('.teacher-stats .stat-value');if(stats.length===3)stats[2].textContent=lessonReflections.length}
    function startLessonUpdates(){stopLessonUpdates();if(!teacherName)return;refreshLessonReflections();if('EventSource'in window){lessonEvents=new EventSource(`/api/lesson-reflection-events?teacher=${encodeURIComponent(teacherName)}`);lessonEvents.onmessage=event=>{try{lessonReflections=JSON.parse(event.data);updateLessonList()}catch{}}}}
    function stopLessonUpdates(){if(lessonEvents){lessonEvents.close();lessonEvents=null}}
    function stopReflectionUpdates(){if(events){events.close();events=null}if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
    function setTeacherDatePeriod(event){const months=Number(event.currentTarget.value);if(!months)return;const end=new Date();const start=shiftMonths(end,months);document.getElementById('teacher-from').value=toDateInput(start);document.getElementById('teacher-to').value=toDateInput(end);renderTeacherList()}
    function filterTeacherReflections(){const classCode=document.getElementById('teacher-class')?.value||'all';const course=document.getElementById('teacher-course')?.value||'all';const from=document.getElementById('teacher-from')?.value||'';const to=document.getElementById('teacher-to')?.value||'';const query=(document.getElementById('teacher-search-text')?.value||'').trim().toLocaleLowerCase();return reflections.filter(item=>{const date=toDateInput(new Date(item.createdAt));return(filter==='all'||(filter==='pending'?!item.reply:Boolean(item.reply)))&&(classCode==='all'||item.classCode===classCode)&&(course==='all'||item.course===course)&&(!from||date>=from)&&(!to||date<=to)&&(!query||`${item.name} ${item.number}`.toLocaleLowerCase().includes(query))})}
    function renderTeacherList(){const list=document.getElementById('teacher-reflection-list');if(!list)return;list.innerHTML=renderTeacherReflections(filterTeacherReflections());list.querySelectorAll('.reply-form').forEach(form=>form.addEventListener('submit',sendReply));list.querySelectorAll('.sticker-button:not(:disabled)').forEach(button=>button.addEventListener('click',giveSticker))}
    function renderClassManagementLegacy(){return `<section class="panel management-panel"><h2>공용 과목을 선택해 학급을 만들어요</h2><p>공용 과목을 골라 학급을 생성합니다. 과목은 자동으로 전체 반에 적용되지 않으며, 선택한 항목만 새 학급에 들어갑니다.</p><div class="course-setup"><form class="global-course-form" id="global-course-form"><label for="global-course-input">공용 과목 등록</label><div><input id="global-course-input" name="course" placeholder="예: 사회, 영어, 미술" required><button type="submit">과목 등록</button></div></form><div class="registered-courses"><strong>학급에 넣을 공용 과목 선택</strong><div id="course-catalog-list">${renderCourseCatalog()}</div><div class="course-pick-summary" id="course-pick-summary">선택한 과목 <strong>0개</strong></div></div></div><form class="class-generator" id="class-generator-form"><div class="field"><label for="class-grade">학년</label><input id="class-grade" name="grade" type="number" min="1" max="12" value="1" required></div><div class="field"><label for="class-count">만들 학급 수</label><input id="class-count" name="count" type="number" min="1" max="40" value="1" required></div><button type="submit">선택 과목으로 학급 만들기</button><p class="generated-note">코드는 학년과 반 번호로 자동 생성됩니다. 예: 2학년 1반 · G2-C01</p></form><section class="custom-class-form-wrap"><h3>학급 코드를 직접 만들기</h3><p>같은 공용 과목 선택을 사용해 원하는 학급 이름과 코드를 등록할 수 있습니다.</p><form class="custom-class-form" id="custom-class-form"><div class="field"><label for="custom-class-name">학급 이름</label><input id="custom-class-name" name="name" placeholder="예: 프로젝트 연구반" required></div><div class="field"><label for="custom-class-code">학급 코드</label><input id="custom-class-code" name="code" placeholder="예: PROJECT-A" required></div><button type="submit">선택 과목으로 학급 추가</button></form></section><div class="classroom-list-heading"><h3>현재 학급 · 과목 관리</h3><span>${classrooms.length}개</span></div><div class="manage-content" id="manage-content">${renderClassrooms()}</div></section>`}
    function renderCourseCatalog(selected=[]){return courseCatalog.length?`<div class="common-course-list">${courseCatalog.map((course,index)=>`<label class="shared-course-choice catalog-course-${index%4}"><input type="checkbox" name="selectedCourses" value="${escapeHTML(course)}" ${selected.includes(course)?'checked':''}><span>${escapeHTML(course)}</span></label>`).join('')}</div>`:'<span class="catalog-empty">아직 과목이 없어요. 먼저 과목을 등록해 주세요.</span>'}
    function selectedSharedCourses(){return [...document.querySelectorAll('#course-catalog-list input[name="selectedCourses"]:checked')].map(input=>input.value)}
    function updateSelectedClassCourseSummary(){const summary=document.querySelector('#course-pick-summary strong');if(summary)summary.textContent=`${selectedSharedCourses().length}개`}

    function renderTeacherReflections(items){
      if(!items.length)return `<div class="empty-state"><img src="/ai-images/happy-bean-mascot.png" alt="해피콩">${reflections.length?'선택한 상태의 성찰일기가 없어요.':'아직 도착한 성찰일기가 없어요.'}<br>학생이 일기를 보내면 이곳에서 함께 볼 수 있어요.</div>`;
      return [...items].sort((a,b)=>b.createdAt-a.createdAt).map(item=>`<article class="teacher-entry"><div class="teacher-entry-top"><div class="student-identity"><span class="student-initial">${escapeHTML(item.name.slice(0,1))}</span><div><strong>${escapeHTML(item.name)} 학생</strong><small>${escapeHTML(item.classCode)} · ${escapeHTML(item.number)}번 · ${escapeHTML(item.course)} · ${dateTime(item.createdAt)}</small></div></div><span class="status-chip ${item.reply?'done':''}">${item.reply?'답장 완료':'답장 대기'}</span></div><div class="entry-meta" style="margin-top:13px"><span>오늘의 마음 · ${escapeHTML(item.mood)}</span><span></span></div><p class="entry-body">${escapeHTML(item.learned)}</p>${item.difficulty?`<div class="reflection-point"><strong>어려웠거나 더 궁금한 점</strong>${escapeHTML(item.difficulty)}</div>`:''}${item.nextStep?`<div class="reflection-point"><strong>다음 시간에 해보고 싶은 것</strong>${escapeHTML(item.nextStep)}</div>`:''}${item.reply?`<div class="teacher-feedback"><strong>보낸 답장</strong><p>${escapeHTML(item.reply)}</p></div>`:`<form class="reply-form" data-id="${escapeHTML(item.id)}"><textarea name="reply" aria-label="${escapeHTML(item.name)} 학생에게 보낼 답장" placeholder="학생이 발견한 점을 짚고, 다음 질문을 건네보세요." required></textarea><button type="submit">답장 보내기</button></form>`}<div class="sticker-wrap"><button class="sticker-button" type="button" data-sticker="${escapeHTML(item.id)}" ${item.stickerAt?'disabled':''}>${item.stickerAt?'칭찬 스티커 전달 완료':'칭찬 스티커 주기'}</button></div></article>`).join('');
    }
    async function sendReply(event){
      event.preventDefault();const form=event.currentTarget;const button=form.querySelector('button');button.disabled=true;
      try{const response=await fetch(`/api/reflections/${encodeURIComponent(form.dataset.id)}/reply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply:new FormData(form).get('reply')})});if(!response.ok)throw new Error();await refreshReflections();showToast('학생에게 답장을 보냈어요.')}
      catch{showToast('답장을 보내지 못했어요. 다시 시도해 주세요.');button.disabled=false}
    }
    async function giveSticker(event){const button=event.currentTarget;button.disabled=true;try{const response=await fetch(`/api/reflections/${encodeURIComponent(button.dataset.sticker)}/sticker`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});if(!response.ok)throw new Error();await refreshReflections();showToast('학생에게 칭찬 스티커를 선물했어요.')}catch{showToast('이미 스티커를 주었거나 기록을 찾을 수 없어요.');button.disabled=false}}
    async function refreshReflections(){const [reflectionResponse,classroomResponse,courseResponse]=await Promise.all([fetch('/api/reflections'),fetch('/api/classrooms'),fetch('/api/courses')]);if(!reflectionResponse.ok||!classroomResponse.ok||!courseResponse.ok)throw new Error('기록을 불러오지 못했어요.');reflections=await reflectionResponse.json();classrooms=await classroomResponse.json();courseCatalog=await courseResponse.json();updateLiveData()}
    function updateLiveData(){
      if(document.getElementById('student-login')){updateStudentCourses();return}
      if(identity){const rewards=document.querySelector('.student-rewards');if(rewards)rewards.outerHTML=renderStudentRewards();const history=document.getElementById('my-history');if(history){const filtered=filterStudentHistory(ownReflections());history.innerHTML=renderStudentHistory(filtered);const count=document.getElementById('history-count');if(count)count.textContent=`${filtered.length}개 표시`;const status=document.getElementById('history-status');if(status)status.textContent=`${filtered.length}개 기록을 찾았어요.`}return}
      if(!document.querySelector('.teacher-stats'))return;
      const stats=document.querySelectorAll('.teacher-stats .stat-value');const pending=reflections.filter(item=>!item.reply).length;
      if(stats.length===3){stats[0].textContent=reflections.length;stats[1].textContent=pending;stats[2].textContent=lessonReflections.length}
      const classFilter=document.getElementById('teacher-class');if(classFilter){const selected=classFilter.value;classFilter.innerHTML=`<option value="all">모든 학급</option>${classrooms.map(item=>`<option value="${escapeHTML(item.code)}">${escapeHTML(item.name)}</option>`).join('')}`;if([...classFilter.options].some(option=>option.value===selected))classFilter.value=selected}
      const courseFilter=document.getElementById('teacher-course');if(courseFilter){const selected=courseFilter.value;courseFilter.innerHTML=`<option value="all">모든 과목</option>${[...new Set(classrooms.flatMap(item=>item.courses))].map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')}`;if([...courseFilter.options].some(option=>option.value===selected))courseFilter.value=selected}
      const badge=document.getElementById('pending-count');if(badge){badge.textContent=`${pending}건 대기`;badge.classList.toggle('done',pending===0)}
      const list=document.getElementById('teacher-reflection-list');if(list){const drafts=new Map([...list.querySelectorAll('.reply-form')].map(form=>[form.dataset.id,form.querySelector('textarea').value]));list.innerHTML=renderTeacherReflections(filterTeacherReflections());list.querySelectorAll('.reply-form').forEach(form=>{const draft=drafts.get(form.dataset.id);if(draft)form.querySelector('textarea').value=draft;form.addEventListener('submit',sendReply)});list.querySelectorAll('.sticker-button:not(:disabled)').forEach(button=>button.addEventListener('click',giveSticker))}
      const lessonClass=document.getElementById('lesson-class');if(lessonClass){const selected=lessonClass.value;lessonClass.innerHTML=classrooms.map(item=>`<option value="${escapeHTML(item.code)}">${escapeHTML(item.name)}</option>`).join('');if(classrooms.some(item=>item.code===selected))lessonClass.value=selected;updateLessonCourses()}
      const summaryClass=document.getElementById('summary-class');if(summaryClass){const selected=summaryClass.value;summaryClass.innerHTML=`<option value="all">모든 학급</option>${classrooms.map(item=>`<option value="${escapeHTML(item.code)}">${escapeHTML(item.name)}</option>`).join('')}`;if([...summaryClass.options].some(option=>option.value===selected))summaryClass.value=selected}
      const summaryCourse=document.getElementById('summary-course');if(summaryCourse){const selected=summaryCourse.value;summaryCourse.innerHTML=`<option value="all">모든 과목</option>${[...new Set(classrooms.flatMap(item=>item.courses))].map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')}`;if([...summaryCourse.options].some(option=>option.value===selected))summaryCourse.value=selected}
      if(document.getElementById('class-summary-results'))renderClassSummaryData()
      const admin=document.getElementById('manage-content');if(admin){admin.innerHTML=renderClassrooms();bindClassroomCourseActions(admin)}updateCourseCatalog();const classHeading=document.querySelector('.classroom-list-heading span');if(classHeading)classHeading.textContent=`${classrooms.length}개`;const leaders=document.querySelector('.leaderboard');if(leaders)leaders.innerHTML=renderLeaderboard(document.getElementById('leaderboard-class')?.value||'all');const rankClass=document.getElementById('leaderboard-class');if(rankClass){const selected=rankClass.value;rankClass.innerHTML=`<option value="all">전체 학급</option>${classrooms.map(item=>`<option value="${escapeHTML(item.code)}">${escapeHTML(item.name)}</option>`).join('')}`;if([...rankClass.options].some(option=>option.value===selected))rankClass.value=selected}if(document.getElementById('sticker-status-list'))renderStickerRows()
    }
    function startLiveUpdates(){if(events||pollTimer)return;refreshReflections().catch(()=>{});if('EventSource'in window){events=new EventSource('/api/reflection-events');events.onmessage=event=>{try{const data=JSON.parse(event.data);reflections=data.reflections;classrooms=data.classrooms;courseCatalog=data.courses||[...new Set(classrooms.flatMap(item=>item.courses))];updateLiveData()}catch{}}}else pollTimer=setInterval(()=>refreshReflections().catch(()=>{}),8000)}
    function stopLiveUpdates(){stopReflectionUpdates();stopLessonUpdates()}
    function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
    renderLogin();
    refreshClassrooms();
  </script>
</body>
</html>
